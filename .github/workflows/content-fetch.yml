name: Content Intelligence — Weekly Fetch

on:
  schedule:
    # Sunday 6am CLT = 10:00 UTC (CLT = UTC-4 in summer)
    - cron: '0 10 * * 0'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6 hours — Batch API can take up to 2h

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Install Chrome for Puppeteer (used for curated sources that block scrapers)
      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run content fetch pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx tsx src/content/scripts/content-fetch-main.ts

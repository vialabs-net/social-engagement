name: devcast Setup

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create setup checklist issue
        uses: actions/github-script@v7
        env:
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_BUFFER: ${{ secrets.BUFFER_ACCESS_TOKEN != '' }}
          HAS_SUPABASE_URL: ${{ secrets.SUPABASE_URL != '' }}
          HAS_SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
          HAS_CONFIG: ${{ secrets.CONFIG_YAML != '' }}
          HAS_PAT: ${{ secrets.GH_PAT != '' }}
        with:
          script: |
            const check = (val) => val === 'true' ? '✅' : '❌';

            const anthropic  = check(process.env.HAS_ANTHROPIC);
            const buffer     = check(process.env.HAS_BUFFER);
            const supaUrl    = check(process.env.HAS_SUPABASE_URL);
            const supaKey    = check(process.env.HAS_SUPABASE_KEY);
            const config     = check(process.env.HAS_CONFIG);
            const pat        = check(process.env.HAS_PAT);

            const allDone =
              process.env.HAS_ANTHROPIC === 'true' &&
              process.env.HAS_BUFFER === 'true' &&
              process.env.HAS_SUPABASE_URL === 'true' &&
              process.env.HAS_SUPABASE_KEY === 'true' &&
              process.env.HAS_CONFIG === 'true' &&
              process.env.HAS_PAT === 'true';

            const status = allDone
              ? '🎉 All secrets are set — devcast is ready to run!'
              : '⚠️ Some secrets are missing. Complete the checklist below.';

            const body = `## devcast Setup Checklist

${status}

### Secrets (Settings → Secrets → Actions)

| Secret | Status | Description |
|--------|--------|-------------|
| \`ANTHROPIC_API_KEY\` | ${anthropic} | Claude API key — get at console.anthropic.com |
| \`BUFFER_ACCESS_TOKEN\` | ${buffer} | Buffer OAuth token — get at buffer.com → Settings → Apps |
| \`SUPABASE_URL\` | ${supaUrl} | Supabase project URL — get at supabase.com → Settings → API |
| \`SUPABASE_SERVICE_ROLE_KEY\` | ${supaKey} | Supabase service role key (same page as URL) |
| \`CONFIG_YAML\` | ${config} | Full content of your \`config.yaml\` (copy from \`config.example.yaml\`) |
| \`GH_PAT\` | ${pat} | Personal Access Token with \`repo\` scope — needed for wiki report |

### Setup Steps

- [ ] **Fork** this repo (Settings → Actions → "Allow all actions")
- [ ] **Supabase**: create project → SQL Editor → run \`database/schema.sql\`
- [ ] **Add all 6 secrets** listed above
- [ ] **Config**: copy \`config.example.yaml\` → fill in \`author.github_username\` and Buffer profile IDs
- [ ] **Buffer profiles**: run \`npm run setup-buffer\` locally to get profile IDs
- [ ] **Voice bootstrap**: edit \`voice-bootstrap.md\` with 3–5 posts in your voice, then run \`npm run bootstrap\`
- [ ] **Wiki**: enable Wiki in Settings → Features → create first page manually
- [ ] **Test**: Actions → "Poll and Generate" → "Run workflow" → check Buffer Ideas inbox

### Re-run this workflow after adding secrets to see updated status.

---
_Generated by devcast setup workflow_`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `devcast setup — ${allDone ? 'ready ✅' : 'action required ⚠️'}`,
              body,
              labels: [],
            });
